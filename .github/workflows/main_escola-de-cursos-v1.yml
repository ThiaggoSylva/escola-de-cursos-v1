name: Build and deploy ASP.Net Core app to Azure Web App - escola-de-cursos-v1

# Dispara em push nas branches principais e permite rodar manualmente
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  AZURE_WEBAPP_NAME: "escola-de-cursos-v1"        # nome do App Service (Windows) no Azure
  PUBLISH_DIR: "${{ github.workspace }}/publish"
  WEBAPP_PROJECT: "EscolaDeCursos.WebApp/EscolaDeCursos.WebApp.csproj"
  INFRA_PROJECT: "EscolaDeCursos.Infra/EscolaDeCursos.Infra.csproj"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # 1) Build + testes + publish da aplicação
  # ---------------------------------------------------------------------
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore --force --no-cache

      - name: Build da solução
        run: dotnet build --configuration Release --no-restore

      - name: Rodar testes (se existirem projetos de teste)
        run: |
          $testProjects = Get-ChildItem -Recurse -Filter *.Tests.csproj
          if ($testProjects) {
            dotnet test --configuration Release --no-build
          } else {
            Write-Host "Nenhum projeto de testes encontrado — pulando."
          }

      - name: Publicar EscolaDeCursos.WebApp
        run: >
          dotnet publish ${{ env.WEBAPP_PROJECT }}
          --configuration Release
          --output ${{ env.PUBLISH_DIR }}

      - name: Upload artefato - aplicação publicada
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publicado
          path: ${{ env.PUBLISH_DIR }}

  # ---------------------------------------------------------------------
  # 2) Aplica as migrations do EF Core no banco (Azure SQL Database)
  #    Roda a partir do código-fonte (não do artefato publicado), usando
  #    o projeto EscolaDeCursos.Infra — é lá que fica o DbContext e a
  #    IDesignTimeDbContextFactory (evita precisar subir o host da WebApp
  #    e a dependência do New Relic durante o deploy).
  # ---------------------------------------------------------------------
  migrate-database:
    runs-on: windows-latest
    needs: build
    environment: production

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Instalar workloads
        run: dotnet workload restore

      - name: Restaurar dependências
        run: dotnet restore

      - name: Verificar variável
        shell: powershell
        run: |
          if ($env:AZURE_SQL_CONNECTION_STRING) {
          Write-Host "Connection String encontrada"
          }
          else {
          Write-Host "Connection String NÃO encontrada"
          exit 1
          }
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Validar Secret SQL
        shell: powershell
        run: |
           if ([string]::IsNullOrWhiteSpace($env:AZURE_SQL_CONNECTION_STRING)) {
           Write-Error "Secret vazio"
           exit 1
           }

           Write-Host "Secret carregado com sucesso"
        env:
         AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      - name: Aguardar Azure SQL iniciar
        shell: powershell
        run: Start-Sleep -Seconds 60

      - name: Aplicar migrations no Azure SQL Database
        shell: powershell
        run: |
         dotnet ef database update `
         --project EscolaDeCursos.Infra/EscolaDeCursos.Infra.csproj `
         --startup-project EscolaDeCursos.WebApp/EscolaDeCursos.WebApp.csproj `
         --configuration Release
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

  # ---------------------------------------------------------------------
  # 3) Deploy no Azure App Service (Windows)
  # ---------------------------------------------------------------------
  deploy:
    runs-on: windows-latest
    needs: migrate-database
    environment:
      name: production
      url: ${{ steps.deploy-step.outputs.webapp-url }}

    steps:
      - name: Baixar artefato da aplicação
        uses: actions/download-artifact@v4
        with:
          name: webapp-publicado
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy no Azure App Service
        id: deploy-step
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}


